name: Embed image

# Publishes the rich-tier embedding server image (Role B):
# ghcr.io/maxgfr/codeindex-embed. Rebuilt on every push to `main` (tagged
# `main` and `sha-<short>`), so the registry always carries an image for the
# current commit. The version tag is read from the committed
# docker/embed/VERSION file (starts at 1.0.0); bump it in the same commit that
# changes the server/model.
#
# Commits merged by grammars-repin with GITHUB_TOKEN never fire `on: push`; that
# job dispatches Release instead, so a dispatched Release run is the trigger for
# those (the `if:` below skips push-started Release runs, already built by push).
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Read image version
        id: meta
        run: |
          echo "version=$(cat docker/embed/VERSION)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch (amd64 + arm64). The model is baked at build time, so both
      # legs download it once during their build — no runtime network needed.
      # A version tag is published once and then stays what it was: it is what
      # `codeindex embed serve` names. Pushing it again on every commit made
      # `:1.0.0` mean whatever main last held, and a host that had pulled it
      # never got the changes made under the same number. A change to the
      # server is released by bumping docker/embed/VERSION.
      #
      # Only "not found" means unpublished. Any other failure (a registry
      # outage, a refused login) fails the job: read as unpublished, it pushed
      # the version tag again over the image it names.
      - name: Version tag already published?
        id: published
        env:
          IMAGE: ghcr.io/maxgfr/codeindex-embed:${{ steps.meta.outputs.version }}
        run: |
          if out="$(docker buildx imagetools inspect "$IMAGE" 2>&1)"; then
            echo "tag=" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$out" | grep -q ': not found$'; then
            echo "tag=$IMAGE" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$out" >&2
            echo "::error::could not tell whether $IMAGE is published"
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: docker/embed
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ${{ steps.published.outputs.tag }}
            ghcr.io/maxgfr/codeindex-embed:latest
            ghcr.io/maxgfr/codeindex-embed:main
            ghcr.io/maxgfr/codeindex-embed:sha-${{ steps.meta.outputs.short }}
