name: Site

# GitHub Pages site. Still a plain static-asset publish — no build step and no
# dependency install — because every generated artifact it serves is already
# committed: site/index.html is hand-written, and scripts/engine.browser.mjs is
# built by scripts/build-browser.mjs and held byte-reproducible by
# `pnpm run check:build`.
#
# Two things the playground needs live outside site/ and are COPIED in here
# rather than duplicated in git: the tree-sitter wasm (22 MB, in
# scripts/grammars/) and the browser bundle itself, which lives in scripts/
# because it is also published to npm as `@maxgfr/codeindex/browser`.
#
# Note on the site's "zero external requests" property: that holds for
# site/index.html, which remains fully self-contained. site/playground/ is
# deliberately different — it fetches repositories from jsDelivr at runtime,
# which is the entire point of a playground.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/grammars/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # The engine bundle, and the grammars that make the AST tier the page
      # exists to demonstrate. Without the grammars the playground still works
      # but silently degrades to regex, so a missing copy would quietly weaken
      # exactly the thing being shown — hence the asserts.
      - name: Stage the engine bundle and grammars for the playground
        run: |
          cp scripts/engine.browser.mjs site/playground/engine.browser.mjs
          cp -R scripts/grammars site/playground/grammars
          test -f site/playground/engine.browser.mjs
          test -f site/playground/grammars/web-tree-sitter.wasm
          test -f site/playground/grammars/typescript.wasm

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
