name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The committed bundle (engine.mjs + engine.d.mts + grammars) must be
      # byte-reproducible from source — consumers vendor those exact bytes.
      - run: pnpm run check:build

  smoke-node18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      # The published artifacts are committed and dependency-free. Exercise
      # those directly: the dev toolchain intentionally requires newer Node.
      - name: Import library and run CLI on Node 18
        run: |
          node -e 'import("./scripts/engine.mjs").then(m => { if (typeof m.scanRepo !== "function") process.exit(1) })'
          node scripts/cli.mjs scan --repo tests/fixtures/mini-repo --out /tmp/codeindex-node18-scan.json
          node scripts/cli.mjs search client --repo tests/fixtures/mini-repo --out /tmp/codeindex-node18-search.json
          test -s /tmp/codeindex-node18-scan.json
          test -s /tmp/codeindex-node18-search.json
      # The pool falls back to a sequential scan when its workers cannot start,
      # and a scan that succeeds says nothing about which path it took: on
      # Node 18 no worker ever started, for months, behind a green smoke test.
      # extractInParallel answers undefined on that fallback, so ask it.
      - name: Extraction workers start on Node 18
        run: |
          node -e '
            import("./scripts/engine.mjs").then(async (m) => {
              const jobs = m.walk("tests/fixtures/mini-repo").files.map((f) => ({ abs: f.abs, rel: f.rel, ext: f.ext }));
              const records = await m.extractInParallel(jobs, [], 2);
              if (!records || records.size !== jobs.length) {
                console.error("extraction workers did not run: " + (records ? records.size + "/" + jobs.length + " records" : "sequential fallback"));
                process.exit(1);
              }
              console.log("extraction workers built " + records.size + " records");
            });
          '
