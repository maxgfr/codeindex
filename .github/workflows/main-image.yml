name: Main image

# Publishes ghcr.io/maxgfr/codeindex:latest, :main and :sha-<short> for every
# commit that lands on `main`, release or not, so `latest` is always the current
# main. Version tags stay owned by the release job (release.yml), since consumers
# pin those.
#
# Chained on the Release workflow rather than `on: push`: Release is also
# started by `workflow_dispatch` (grammars-repin self-merges with GITHUB_TOKEN,
# which never fires `on: push`), and waiting for it means the image is only
# published once the typecheck / test / bundle gate has passed.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: main-image
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      # The commit whose gate just passed, or the release commit made from it.
      # head_sha alone is the commit BEFORE the version bump: building it
      # pushed `:latest` over the image release.yml had just built from the
      # tag, so `latest` announced the previous ENGINE_VERSION after every
      # release. main's head alone may be a later push whose own Release has
      # not passed yet. So: the release commit cut from head_sha — the commit
      # right after it in main's first-parent history, when that one is a
      # `chore(release)` — and head_sha otherwise. Not main's head: a commit
      # pushed after the release commit, before this step ran, made the head
      # something else, and the pre-bump commit was built again.
      - name: Pick the gated commit
        if: github.event_name == 'workflow_run'
        env:
          GATED: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch origin main
          gated="$(git rev-parse "$GATED")"
          # sed, not head: head exits at its first line, and under the runner's
          # `bash -eo pipefail` the SIGPIPE it leaves rev-list fails the step.
          child="$(git rev-list --first-parent --reverse "$gated..origin/main" | sed -n 1p)"
          if [ -n "$child" ] && [ "$(git rev-parse "$child^")" = "$gated" ] && git log -1 --format=%s "$child" | grep -q '^chore(release): '; then
            git checkout --detach "$child"
          fi
          git log -1 --format='building %h %s'

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build as the release image (multi-arch, repo-root Dockerfile).
      - name: Build and push
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="sha-${{ steps.sha.outputs.short }}" \
            --push \
            -t ghcr.io/maxgfr/codeindex:latest \
            -t ghcr.io/maxgfr/codeindex:main \
            -t ghcr.io/maxgfr/codeindex:sha-${{ steps.sha.outputs.short }} \
            .
