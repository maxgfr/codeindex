name: Main image

# Publishes ghcr.io/maxgfr/codeindex:main and :sha-<short> for every commit that
# lands on `main`, release or not. `latest` and the version tags stay owned by
# the release job (release.yml), since consumers pin those.
#
# Chained on the Release workflow rather than `on: push`: Release is also
# started by `workflow_dispatch` (grammars-repin self-merges with GITHUB_TOKEN,
# which never fires `on: push`), and waiting for it means the image is only
# published once the typecheck / test / bundle gate has passed.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: main-image
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build as the release image (multi-arch, repo-root Dockerfile).
      - name: Build and push
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="sha-${{ steps.sha.outputs.short }}" \
            --push \
            -t ghcr.io/maxgfr/codeindex:main \
            -t ghcr.io/maxgfr/codeindex:sha-${{ steps.sha.outputs.short }} \
            .
